<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04101f" />
      <stop offset="50%" stop-color="#071a33" />
      <stop offset="100%" stop-color="#0a2547" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4295ff" />
      <stop offset="100%" stop-color="#1261d6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4295ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1261d6" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4295ff" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="2" />
  <rect width="1200" height="340" rx="18" fill="url(#grid)" />

  <!-- Decorative Glow Circles -->
  <circle cx="1020" cy="80" r="220" fill="url(#glowGrad)" />
  <circle cx="160" cy="290" r="180" fill="url(#glowGrad)" />

  <!-- Top Left Status Pill -->
  <g transform="translate(64, 48)">
    <rect x="0" y="0" width="295" height="34" rx="17" fill="#0d2847" stroke="#1e4976" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" letter-spacing="0.4">
      DISPONÍVEL PARA OPORTUNIDADES
    </text>
  </g>

  <!-- Main Title & Role -->
  <g transform="translate(64, 138)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Segoe UI', Inter, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Italo Holanda <tspan fill="url(#accentGrad)">Neves.</tspan>
    </text>
    <text x="0" y="44" font-family="'Segoe UI', Inter, sans-serif" font-size="22" font-weight="600" fill="#93c5fd" letter-spacing="0.2">
      Desenvolvedor Web Full-Stack  |  UI/UX  |  Análise e Desenvolvimento de Sistemas
    </text>
    <text x="0" y="84" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Transformando ideias em interfaces modernas, sistemas web escaláveis e experiências digitais de alto impacto.
    </text>
  </g>

  <!-- Bottom Metadata Pills -->
  <g transform="translate(64, 262)">
    <!-- Location -->
    <rect x="0" y="0" width="175" height="36" rx="8" fill="#091e38" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#e2e8f0">
      📍 Manaus, AM - BR
    </text>

    <!-- Education -->
    <rect x="190" y="0" width="235" height="36" rx="8" fill="#091e38" stroke="#1e3a5f" stroke-width="1" />
    <text x="206" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#e2e8f0">
      🎓 ADS • Senac Amazonas
    </text>

    <!-- Experience -->
    <rect x="440" y="0" width="245" height="36" rx="8" fill="#091e38" stroke="#1e3a5f" stroke-width="1" />
    <text x="456" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#e2e8f0">
      💻 Dev Web • IDESAM
    </text>
  </g>

  <!-- Right Side Code Card Illustration -->
  <g transform="translate(835, 58)">
    <rect x="0" y="0" width="305" height="224" rx="14" fill="#051326" stroke="#1e4976" stroke-width="1.5" />
    <!-- Window Controls -->
    <circle cx="22" cy="22" r="5.5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5.5" fill="#f59e0b" />
    <circle cx="58" cy="22" r="5.5" fill="#22c55e" />
    <text x="125" y="26" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#64748b">italo-holanda.ts</text>
    <line x1="0" y1="40" x2="305" y2="40" stroke="#1e3a5f" stroke-width="1" />

    <!-- Code Content -->
    <g transform="translate(20, 68)" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5">
      <text x="0" y="0" fill="#60a5fa">const <tspan fill="#f8fafc">developer</tspan> = {</text>
      <text x="16" y="24" fill="#94a3b8">nome: <tspan fill="#38bdf8">'Italo Holanda'</tspan>,</text>
      <text x="16" y="48" fill="#94a3b8">foco: <tspan fill="#38bdf8">['Front-End', 'Full-Stack']</tspan>,</text>
      <text x="16" y="72" fill="#94a3b8">stack: <tspan fill="#38bdf8">['JS', 'React', 'SQL']</tspan>,</text>
      <text x="16" y="96" fill="#94a3b8">metodologia: <tspan fill="#38bdf8">'Agile / Sprints'</tspan>,</text>
      <text x="16" y="120" fill="#94a3b8">status: <tspan fill="#4ade80">'Pronto para somar 🚀'</tspan></text>
      <text x="0" y="142" fill="#60a5fa">};</text>
    </g>
  </g>
</svg>
